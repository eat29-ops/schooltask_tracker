<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f4f6f9; overflow-x:hidden; }

        .chart-box {
            height: 280px;
            position: relative;
        }

        canvas {
            max-height: 280px !important;
        }

        .task {
            display:flex;
            justify-content:space-between;
            padding:10px;
            border-bottom:1px solid #eee;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h3>Welcome {{ username }}</h3>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

    <div class="card p-3 mb-3">
        <h5>Quote</h5>
        <p>{{ quote }}</p>
        <p><b>Tip:</b> {{ tip }}</p>
    </div>

    <div class="row">

        <!-- TASK INPUT -->
        <div class="col-md-4">
            <div class="card p-3">
                <h5>Add Task</h5>
                <form method="POST" action="/add">
                    <input name="task" class="form-control mb-2" placeholder="Task">
                    <select name="day" class="form-control mb-2">
                        <option>Sunday</option>
                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>Wednesday</option>
                        <option>Thursday</option>
                        <option>Friday</option>
                        <option>Saturday</option>
                    </select>
                    <button class="btn btn-primary w-100">Add</button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div class="col-md-8">

            <div class="card p-3 mb-3">
                <h5>Weekly Chart</h5>

                <div class="chart-box">
                    <canvas id="taskChart"
                        data-task='{{ task_data | tojson }}'></canvas>
                </div>

            </div>

            <div class="card p-3">
                <h5>Tasks</h5>

                {% for t in tasks %}
                <div class="task">
                    <div>{{ t[1] }} ({{ t[2] }})</div>
                    <a href="/delete/{{ t[0] }}" class="btn btn-sm btn-danger">X</a>
                </div>
                {% endfor %}

            </div>

        </div>
    </div>

</div>

<script>
const taskData = JSON.parse(document.getElementById("taskChart").dataset.task || "{}");

const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

new Chart(document.getElementById("taskChart"), {
    type: "bar",
    data: {
        labels: days,
        datasets: [{
            label: "Tasks",
            data: days.map(d => taskData[d] || 0),
            backgroundColor: "rgba(54,162,235,0.6)"
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            y: {
                beginAtZero: true,
                ticks: { precision: 0 }
            }
        }
    }
});
</script>

</body>
</html>
